<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for the contact list */
        .contact-list-container::-webkit-scrollbar {
            width: 6px;
        }
        .contact-list-container::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .contact-list-container::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .contact-list-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Smooth transitions */
        .contact-card {
            transition: all 0.2s ease-in-out;
        }
        .contact-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-8 md:py-12">
        <!-- Header -->
        <header class="mb-8 text-center md:text-left flex flex-col md:flex-row items-center justify-between">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 flex items-center justify-center md:justify-start gap-3">
                    <i class="fa-solid fa-address-book text-indigo-600"></i>
                    Contacts Directory
                </h1>
                <p class="text-slate-500 mt-2 text-sm md:text-base">Manage your personal and professional connections</p>
            </div>
            
            <div class="mt-4 md:mt-0 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-200 flex items-center">
                <i class="fa-solid fa-users text-slate-400 mr-2"></i>
                <span id="contact-count" class="font-semibold text-indigo-600">0</span>
                <span class="text-slate-500 ml-1 text-sm">Contacts</span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Add Contact Form -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sticky top-6">
                    <h2 class="text-xl font-semibold mb-6 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i class="fa-solid fa-user-plus text-indigo-500"></i>
                        Add New Contact
                    </h2>
                    
                    <form id="contact-form" class="space-y-4">
                        <!-- Name Field -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-user text-slate-400"></i>
                                </div>
                                <input type="text" id="name" required
                                    class="pl-10 w-full rounded-lg border-slate-300 border py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                                    placeholder="e.g. Jane Doe">
                            </div>
                        </div>

                        <!-- Primary Phone Field -->
                        <div>
                            <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Primary Phone *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-phone text-slate-400"></i>
                                </div>
                                <input type="tel" id="phone" required
                                    class="pl-10 w-full rounded-lg border-slate-300 border py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                                    placeholder="(555) 123-4567">
                            </div>
                        </div>

                        <!-- Secondary Phone Field -->
                        <div>
                            <label for="secPhone" class="block text-sm font-medium text-slate-700 mb-1">Secondary Phone <span class="text-slate-400 font-normal">(Optional)</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-mobile-screen-button text-slate-400"></i>
                                </div>
                                <input type="tel" id="secPhone"
                                    class="pl-10 w-full rounded-lg border-slate-300 border py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                                    placeholder="(555) 987-6543">
